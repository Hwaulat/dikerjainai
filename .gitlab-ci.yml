default:
  interruptible: true

stages:
  - build
  - security
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_HOST: unix:///var/run/docker.sock
  SSH_PORT: "22"

# ─────────────────────────────────────────────────────────────
# Stage 1: Build Docker image & push to GitLab Container Registry
# ─────────────────────────────────────────────────────────────
build_and_push:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache docker-cli
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --tag "$DOCKER_IMAGE:$IMAGE_TAG" --tag "$DOCKER_IMAGE:latest" .
    - docker push "$DOCKER_IMAGE:$IMAGE_TAG"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - dev

# ─────────────────────────────────────────────────────────────
# Stage 2: Security vulnerability scan with Aqua Trivy
# ─────────────────────────────────────────────────────────────
trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --severity HIGH,CRITICAL --format table "$DOCKER_IMAGE:$IMAGE_TAG"
    - trivy image --format json --output trivy-report.json "$DOCKER_IMAGE:$IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-report.json
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - dev

# ─────────────────────────────────────────────────────────────
# Stage 3: SSH Zero-Downtime Deployment to Production Host
# ─────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - |
      ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "bash -s" << EOF
        set -euo pipefail
        cd "${DEPLOY_PATH}"
        
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
        
        TARGET_IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"
        if grep -q '^DOCKER_IMAGE_TAG=' .env; then
          sed -i "s|^DOCKER_IMAGE_TAG=.*|DOCKER_IMAGE_TAG=\${TARGET_IMAGE}|" .env
        else
          echo "DOCKER_IMAGE_TAG=\${TARGET_IMAGE}" >> .env
        fi
        
        docker compose pull
        docker compose up -d --remove-orphans
        docker compose ps
        docker image prune -f
      EOF
  after_script:
    - ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "docker logout '$CI_REGISTRY' || true" || true
    - eval $(ssh-agent -k) || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - dev
