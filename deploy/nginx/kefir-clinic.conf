# Rate limiting zones (placed in http context or included in conf.d)
# limit_req_zone $binary_remote_addr zone=kefir_req_limit:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=kefir_login_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name clinic.kefir.id; # Replace with your production domain

    # Let's Encrypt ACME challenge path for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinic.kefir.id; # Replace with your production domain

    # SSL Certificates managed via Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/clinic.kefir.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.kefir.id/privkey.pem;

    # SSL Security hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size for clinical photos & Excel reports
    client_max_body_size 25M;

    # Block access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Strict rate limiting on authentication endpoint
    location /api/auth/login {
        # limit_req zone=kefir_login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3344;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3344;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade headers (Baileys / Live sync)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for heavy report queries & sync
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
