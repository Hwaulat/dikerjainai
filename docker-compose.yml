services:
  app:
    image: ${DOCKER_IMAGE_TAG:-registry.gitlab.com/dev-ragdalion/kefir-clinic-dashboard:latest}
    container_name: ${CONTAINER_NAME:-kefir_clinic_dashboard}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3344}
      HOST: 0.0.0.0
      TZ: Asia/Jakarta
    ports:
      # Expose only to localhost loopback so Host Nginx can reach it securely
      - "127.0.0.1:${APP_PORT:-3344}:${PORT:-3344}"
    volumes:
      # Persistent local state & databases
      - ./data:/app/data
      - ./wa_assistant_auth:/app/wa_assistant_auth
      - ./logs:/app/logs
    extra_hosts:
      # Allows container to reach host services (e.g. host databases or local bridges)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3344) + '/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL (opsional): docker compose --profile db up -d
  # Lalu isi STORAGE_BACKEND=postgres dan
  # DATABASE_URL=postgres://kefir:<POSTGRES_PASSWORD>@db:5432/kefir_clinic di .env
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    container_name: ${CONTAINER_NAME:-kefir_clinic_dashboard}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kefir
      POSTGRES_DB: kefir_clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kefir -d kefir_clinic"]
      interval: 10s
      timeout: 5s
      retries: 5
